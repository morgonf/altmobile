# Часы телефона при загрузке показывают август или 1970 год, пока их не
# подведёт сеть. Личные временные папки pam_mktemp, созданные в это время,
# выглядят старше 10 дней, и systemd-tmpfiles-clean удалял их через 15 минут
# после загрузки. Программы теряли TMPDIR (Chromium не запускался).
x /tmp/.private
x /tmp/.private/*
