# ALT Mobile: neard 0.20 завершается, когда шина D-Bus отключает его за
# неправильное сообщение (метка без UID, исправлено в основной ветке neard
# после 0.20). Запускает его только udev при появлении nfc0, поэтому без
# перезапуска NFC пропадал до перезагрузки.
[Service]
Restart=always
RestartSec=2
