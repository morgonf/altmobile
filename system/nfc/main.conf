# ALT Mobile, OnePlus 6T (NXP PN553). По умолчанию neard после загрузки
# держит адаптер выключенным. Опрос перезапускает служба alt-nfc-poll, а не
# ConstantPoll: neard перезапускает его сразу, и карта в чехле находится
# снова и снова каждые 4 секунды. У службы пауза растёт до 30 секунд.
[General]
DefaultPowered=true
ConstantPoll=false
