<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- ALT Mobile: neard (root) вызывает обработчиков меток (NDEF и Handover
     агенты) у программ пользователя. В пакете neard ALT правила для root
     ограничены send_destination="org.neard" (патч openSUSE), а адресат
     вызова агенту это уникальное имя его процесса, и вызов запрещён. -->
<busconfig>
    <policy user="root">
        <allow send_interface="org.neard.NDEFAgent"/>
        <allow send_interface="org.neard.HandoverAgent"/>
    </policy>
</busconfig>
