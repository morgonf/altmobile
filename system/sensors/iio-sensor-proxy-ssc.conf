# ALT Mobile: датчики SSC отдаёт hexagonrpcd, без него при загрузке
# iio-sensor-proxy их не находит; доступ к QRTR для libssc. Запуск только
# после того, как акселерометр реально отвечает (alt-sensors-wait.sh).
[Unit]
After=hexagonrpcd-sdsp.service
Wants=hexagonrpcd-sdsp.service

[Service]
ExecStartPre=/usr/local/bin/alt-sensors-wait.sh
TimeoutStartSec=90
RestrictAddressFamilies=AF_UNIX AF_LOCAL AF_NETLINK AF_QIPCRTR
