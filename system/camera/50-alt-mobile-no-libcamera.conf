# ALT Mobile: WirePlumber не перечисляет камеры через libcamera. Монитор
# держал открытыми все узлы камер, в том числе драйверы фокуса SA3103, и
# питание объективов (main_cam_vaf, sub_cam_vaf, lvs1) не выключалось
# никогда. «Камера» работает с libcamera напрямую. Без монитора камеры не
# видны программам через PipeWire (портал камеры в браузерах).
wireplumber.profiles = {
  main = {
    monitor.libcamera = disabled
  }
}
