<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  ALT Mobile: одно начертание во всей теме. Из PT Root UI видно только
  Regular (Light, Medium и Bold спрятаны), утолщение запрещено, поэтому
  элементы с Font.ExtraLight или Font.Bold рисуются тем же Regular.
  sans-serif ведёт на PT Root UI, моноширинный остаётся Noto Sans Mono.
-->
<fontconfig>
  <selectfont>
    <rejectfont>
      <pattern><patelt name="family"><string>PT Root UI</string></patelt><patelt name="weight"><int>50</int></patelt></pattern>
      <pattern><patelt name="family"><string>PT Root UI</string></patelt><patelt name="weight"><int>100</int></patelt></pattern>
      <pattern><patelt name="family"><string>PT Root UI</string></patelt><patelt name="weight"><int>200</int></patelt></pattern>
    </rejectfont>
  </selectfont>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>PT Root UI</family></prefer>
  </alias>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>PT Root UI</family></prefer>
  </alias>
  <match target="font">
    <test name="family"><string>PT Root UI</string></test>
    <edit name="embolden" mode="assign"><bool>false</bool></edit>
  </match>
</fontconfig>
